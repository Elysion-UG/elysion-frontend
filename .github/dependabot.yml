# Dependabot keeps our SHA-pinned GitHub Actions current (#69). Actions are
# pinned to immutable commit SHAs in .github/workflows/*.yml for supply-chain
# safety; without automated bumps those pins would silently go stale. Dependabot
# opens PRs that update both the SHA and the trailing `# vX.Y.Z` version comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # One PR per week for routine action bumps instead of one per action.
      github-actions:
        patterns:
          - "*"
