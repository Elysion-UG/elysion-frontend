name: E2E Tests

# Nur manuell: Der tägliche Cron ist stillgelegt, weil dieser Workflow noch nie
# grün war (0/40 Läufe) und jeden Morgen eine Fehler-Mail erzeugt hat. Ursachen
# und offene Designfrage (wogegen soll die Suite laufen?) siehe #144 — der Cron
# gehört erst zurück, wenn der Lauf tatsächlich grün ist.
on:
  # Manuell starten — z.B. gegen Staging-URL
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to test against (leave empty for staging default)"
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.inputs.base_url || vars.E2E_BASE_URL || 'http://localhost:3000' }}

      # Backend-Adresse NUR server-seitig setzen. NEXT_PUBLIC_API_URL wäre der
      # falsche Hebel: gesetzt schaltet sie den Direkt-Modus ohne Auth-Proxy
      # ein, in dem das session_present-Cookie und damit das Middleware-Gate
      # (#68) konstruktionsbedingt nicht funktionieren — siehe #145. Der bis
      # hierher eingetragene Host (marketplace-backend-1-1w30) ist zudem tot.
      API_URL: ${{ vars.E2E_API_URL || 'https://elysion-backend-stage.onrender.com' }}

      # Ohne diese drei wirft der Startup-Guard in src/middleware.ts bei JEDEM
      # Request — die Hauptursache, warum der Workflow nie grün war (#144).
      SELLER_DOMAIN: seller.localhost:3000
      ADMIN_DOMAIN: admin.localhost:3000
      BUYER_DOMAIN: localhost:3000
      NEXT_PUBLIC_SELLER_DOMAIN: seller.localhost:3000
      NEXT_PUBLIC_ADMIN_DOMAIN: admin.localhost:3000
      NEXT_PUBLIC_BUYER_DOMAIN: localhost:3000

      E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
      E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
      # buyer2 (Warenkorb + Adresse) — eigener Account, eigenes Secret-Paar.
      E2E_BUYER2_EMAIL: ${{ secrets.E2E_BUYER2_EMAIL }}
      E2E_BUYER2_PASSWORD: ${{ secrets.E2E_BUYER2_PASSWORD }}
      E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
      E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Die Portal-Tests sprechen seller./admin.localhost an. Ob *.localhost
      # auf 127.0.0.1 auflöst, hängt am Resolver des Runners — explizite
      # hosts-Einträge machen das unabhängig davon deterministisch.
      - name: Portal-Hosts eintragen
        run: |
          echo "127.0.0.1 seller.localhost admin.localhost" | sudo tee -a /etc/hosts

      # e2e/** wird vom Haupt-typecheck (tsconfig.check.json) NICHT erfasst.
      # Genau dadurch schlüpften undefinierte Referenzen durch (persistAdminState
      # ohne Import → ReferenceError erst zur Laufzeit, #144). Hier prüfen wir die
      # Specs eigenständig, bevor Build/Playwright überhaupt starten.
      - name: E2E-Typen prüfen
        run: bun run typecheck:e2e

      - name: Build app
        run: bun run build

      # Render fährt das Stage-Backend bei Inaktivität herunter; der erste
      # Request weckt es (Kaltstart 30–60 s). Ohne Warmup lief der erste Login
      # in den 20-s-waitForResponse-Timeout und riss alle Setups (#144). Wir
      # warten hier, bis das Backend gesund antwortet — analog stage-smoke.yml.
      - name: Auf Backend warten (Kaltstart)
        run: |
          echo "Warte auf $API_URL ..."
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              "$API_URL/api/v1/products?size=1" || true)
            if [ "$code" = "200" ]; then
              echo "Backend bereit (Versuch $i)"
              exit 0
            fi
            echo "Versuch $i: HTTP $code — warte 15 s"
            sleep 15
          done
          echo "::error::Backend nach 10 Minuten nicht erreichbar"
          exit 1

      # Start/wait-on übernimmt jetzt der webServer-Block in
      # playwright.config.ts — `bun run start &` überlebte den Step-Wechsel
      # nicht und ließ wait-on in den 60-s-Timeout laufen (#144).
      # stage-smoke ist bewusst NICHT dabei: das Projekt läuft gegen die
      # deployten Stage-Domains, hat einen eigenen Workflow (stage-smoke.yml)
      # und würde hier nur zusätzliche Logins gegen dasselbe IP-Rate-Limit
      # verbrauchen. Die Setup-Projekte zieht Playwright über `dependencies`.
      - name: Run Playwright tests
        run: >
          bunx playwright test
          --project=chromium
          --project=seller
          --project=buyer
          --project=admin

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos/screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7
